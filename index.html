<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Grave Shift</title>
<meta name="description" content="1 robber vs 3 guards in a pitch-black graveyard. Play with friends online.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Karla:wght@400;600;800&family=DM+Mono:wght@500&display=swap">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Karla:wght@400;600;800&family=DM+Mono:wght@500&display=swap">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Karla:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D night scene; thin ledger strip on top, thumb controls in the bottom corners, dark cards for menus */
:root{
  --night:#0b1220; --ink:#ebe4d0; --dim:#a39f90; --brass:#d9b35c; --moss:#7fa877; --ember:#e08a3c; --blood:#d0583f;
  --panel:#121826f2; --panel2:#1b2232; --line:#33394a;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:Karla, system-ui, -apple-system, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden}
#gl,#cv{position:absolute;inset:0;display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.chip{background:#0a0f1acc;border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:flex-start;flex:0 1 110px;min-width:0;gap:1px}
.chip .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.chip b{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;max-width:100%}
.meter{display:block;width:100%;height:4px;border-radius:2px;background:#ffffff1a;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;width:0;background:var(--moss);transition:width .3s,background .3s}
#banner{position:absolute;left:16px;right:16px;top:24%;text-align:center;font-family:var(--display);font-size:clamp(30px,8vw,54px);color:var(--brass);text-shadow:0 2px 0 #000,0 0 24px #000;opacity:0;transform:scale(.92);transition:opacity .25s,transform .25s;text-wrap:balance}
#banner.show{opacity:1;transform:none}
#hud.ending .ctl,#hud.ending .top,#hud.ending #tag,#hud.ending #bView,#hud.ending #bGfx{display:none}
#bView,#bGfx{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 72px);pointer-events:auto;background:#0a0f1acc;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);touch-action:none}
#bGfx{top:calc(env(safe-area-inset-top,0px) + 108px)}
#obj{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);max-width:min(54%,300px);text-align:right;font-size:12px;font-weight:800;letter-spacing:.02em;color:#ecbc52;text-shadow:0 1px 3px #000,0 0 10px #000;line-height:1.3}
#hud.ending #obj{display:none}
.ctl{position:absolute;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 22px) 0;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:12px;align-items:end;justify-items:end}
#prompt{grid-column:1 / 3;font-size:14px;font-weight:600;color:var(--ink);text-shadow:0 1px 3px #000;min-height:18px}
.tb{pointer-events:auto;border-radius:50%;border:2px solid #00000080;display:grid;place-items:center;text-transform:uppercase;font-weight:800;letter-spacing:.06em;touch-action:none}
.tb.big{width:104px;height:104px;background:var(--brass);color:#1b150a;font-size:16px;box-shadow:0 4px 0 #6e5520}
.tb.big.grab{background:#c8452f;color:#fff;box-shadow:0 4px 0 #6a1f14;animation:grabPulse .5s ease-in-out infinite alternate}
@keyframes grabPulse{to{transform:scale(1.07)}}
.tb.big:disabled{background:#3f3d36;color:#7d7766;box-shadow:0 4px 0 #24231e}
.side{display:flex;flex-direction:column;gap:12px}
.tb.small{width:66px;height:66px;background:#1f2533e6;color:var(--ink);font-size:11px;border-color:var(--line)}
.tb.small:disabled{opacity:.4}
.tb.small.on{background:#5a4618;color:#ffd98a;border-color:var(--brass)}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:#04070dc4;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#modal.sheet{background:transparent;place-items:end center;pointer-events:none}
#modal.sheet .card{pointer-events:auto;max-height:56%}
#modal.clear{background:#04070d55}
.card{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px #000a;touch-action:pan-y}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;color:#f3e7c4;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.years{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:4px}
.epitaph{margin:0;font-family:var(--display);font-size:21px;color:#cfc7b0;font-style:italic}
p{margin:0;line-height:1.45}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.facts div{background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0}
.facts dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:2px 0 0;font-weight:700}
.note{font-size:14px;color:var(--dim)}
.warn{color:var(--blood);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1 1 140px}
.btn{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px;padding:0 14px}
.btn.primary{background:var(--brass);color:#1b150a;border-color:#8a6b2a}
.btn.danger{background:#5a2219;color:#ffd7cc;border-color:#86382a}
.dighead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dighead b{font-family:var(--display);font-weight:400;font-size:22px}
#kNear{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;background:#ffffff14;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .15s}
.grid{display:grid;gap:8px}
.cell{aspect-ratio:1.25;max-width:100%;border-radius:10px;border:none;position:relative;overflow:hidden;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#f3e7c4b0;touch-action:manipulation}
.cell.dirt{background:#5b4330}.cell.root{background:#4b3a24;background-image:repeating-linear-gradient(35deg,transparent 0 9px,#2e2214 9px 12px)}
.cell.rock{background:#626168;background-image:radial-gradient(circle at 30% 30%,#7a7980 0 22%,transparent 23%),radial-gradient(circle at 70% 65%,#55545b 0 26%,transparent 27%)}
.cell .f{position:absolute;inset:0;background:#0b0806;opacity:0;transition:opacity .1s}
.cell span{position:relative}
.cell.clear{background:#0b0806;color:#ebe4d080}
.cell.hit{animation:hit .12s}
@keyframes hit{50%{transform:scale(.93)}}
.diglog{font-size:14px;min-height:20px;color:#d8cfb6}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:6px}
.sec b{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:0}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px}
.item .nm{font-weight:800;font-size:16px}
.item .meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .rar{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.item .val{font-family:var(--mono);color:var(--ink)}
.pips{display:inline-flex;gap:2px}.pips i{width:8px;height:8px;border-radius:2px;background:var(--dim)}
.item .ds{font-size:13px;color:#bdb6a2;margin-top:3px}
.item button{min-height:44px;min-width:72px;border-radius:8px;border:1px solid var(--line);background:#283041;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.item button.take{background:var(--brass);color:#1b150a;border-color:#8a6b2a}
.item button:disabled{opacity:.45}
.slots{display:flex;gap:4px;flex-wrap:wrap}.slots i{width:22px;height:14px;border-radius:3px;background:#ffffff14;border:1px solid #ffffff12}
.empty{font-size:14px;color:var(--dim);padding:4px 0}
.event{background:#2a2113;border:1px solid #5a4620;color:#f1d79a;border-radius:8px;padding:10px 12px;font-weight:600}
.event.bad{background:#2c1512;border-color:#6a2c22;color:#ffc2b4}
.logo{font-family:var(--display);font-size:clamp(46px,13vw,76px);line-height:.9;color:#f3e7c4;text-align:center;letter-spacing:.02em}
.tag{text-align:center;color:var(--brass);font-weight:600}
.stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:14px;color:var(--dim)}
.stats b{color:var(--ink);font-weight:500}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;color:#cfc7b0;font-size:14px;line-height:1.4}
.ledger{display:flex;flex-direction:column;gap:4px;font-size:15px}
.ledger div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:4px 0}
.ledger span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ledger .tot{border:none;font-weight:800;font-size:18px;color:var(--brass);padding-top:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:12px}
.up .nm{font-weight:800}
.up .ds{font-size:13px;color:#bdb6a2;margin-top:2px}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.lv i{width:9px;height:9px;border-radius:50%;border:1px solid var(--brass)}.lv i.f{background:var(--brass)}
.up button{min-height:48px;min-width:92px;border-radius:8px;border:1px solid #8a6b2a;background:var(--brass);color:#1b150a;font-weight:800;font-family:var(--mono)}
.up button:disabled{background:#283041;color:var(--dim);border-color:var(--line)}
.cash{font-family:var(--mono);font-size:18px;color:var(--brass)}
.link{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;align-self:center;padding:8px}
#c3{pointer-events:auto;cursor:pointer}
#bankFill{background:var(--brass)!important}
#tag{position:absolute;left:0;top:0;width:min(280px,calc(100% - 32px));background:#0d1320eb;border:1px solid var(--line);border-radius:12px;padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 24px #0009;pointer-events:none;will-change:transform}
#tag .ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#tag .nm{font-family:var(--display);font-size:21px;line-height:1.05;color:#f3e7c4}
#tag .yr{font-family:var(--mono);font-size:11px;color:var(--dim)}
#tag .ep{font-family:var(--display);font-style:italic;font-size:15px;color:#cfc7b0;line-height:1.25;margin-top:2px}
#tag .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
#tag .pill{font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--panel2);border-radius:999px;padding:3px 8px;color:var(--ink)}
#tag .wn{font-size:12px;font-weight:800;color:var(--blood);margin-top:3px}
#modal.shop .card{max-height:54%}
.job{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.job b{font-family:var(--display);font-weight:400;font-size:22px;color:#f3e7c4}
.cashrow{display:flex;justify-content:space-between;align-items:baseline}
.cashrow .cash{font-size:22px}
.row.links{justify-content:center;gap:4px}.row.links button{flex:0 0 auto}
#say{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:min(500px,calc(100% - 32px));background:#efe3c4;color:#21170c;border-radius:14px;padding:10px 14px 12px;box-shadow:0 10px 30px #000a;display:flex;flex-direction:column;gap:2px;pointer-events:none}
#say .sn{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7a5a2a}
#say .st{font-family:var(--display);font-size:19px;line-height:1.2}
#say.pop{animation:sayPop .25s ease-out}
@keyframes sayPop{from{transform:translate(-50%,-6px);opacity:.3}}
/* online room */
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.fld input{font:inherit;font-size:18px;letter-spacing:.04em;text-transform:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
.fld input:focus{outline:2px solid var(--brass);outline-offset:1px}
h2.code{font-family:var(--mono);font-size:44px;letter-spacing:.18em;color:var(--brass)}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seat.me{border-color:var(--brass)}
.seat b{font-size:16px}.seat i{color:var(--dim);font-style:normal}
.seat .ds{font-size:12px;color:#bdb6a2;margin-top:2px}
.seat button{min-height:44px;min-width:96px;border-radius:8px;border:1px solid #8a6b2a;background:var(--brass);color:#1b150a;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
/* random robber wheel */
.seat.spin{transition:background .08s}
.seat.spin.rob{border-color:var(--blood);background:#2c1512}
.seat.spin.rob b{color:#ffc2b4}
.seat.spin.won{animation:spinWon .5s ease-out 2}
@keyframes spinWon{50%{transform:scale(1.04);box-shadow:0 0 0 3px var(--blood)}}
.spinmsg{text-align:center;font-family:var(--display);font-size:26px;color:#ffc2b4;text-shadow:0 0 18px #d0583f88}
/* perk picker */
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.perk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:66px;touch-action:manipulation}
.perk b{font-weight:800;font-size:15px}
.perk span{font-size:13px;color:#bdb6a2;line-height:1.35}
.perk.on{border-color:var(--brass);background:#2e2614;box-shadow:inset 0 0 0 1px var(--brass)}
.perk.on b{color:var(--brass)}
.perk .chk{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.06em}
.row.stick{position:sticky;bottom:-20px;background:var(--panel);padding:10px 0 6px;margin:0 0 -6px;border-top:1px solid var(--line)}
.btn:disabled{opacity:.55}
.plist{font-size:13px;color:#cfc7b0;line-height:1.45}
.plist b{color:var(--brass);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="game">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="top">
      <div class="chip"><span class="lbl">Dawn in</span><b id="tTime">6:00</b></div>
      <div class="chip"><span class="lbl" id="tBankL">Banked</span><b id="tBank">$0</b><i class="meter"><i id="bankFill"></i></i></div>
      <div class="chip" id="c3"><span class="lbl" id="c3l">Bag</span><b id="c3v">$0</b></div>
      <div class="chip"><span class="lbl" id="c4l">Graves</span><b id="c4v">0 open</b></div>
    </div>
    <div id="obj"></div>
    <button id="bView" type="button">3rd person</button>
    <button id="bGfx" type="button">Graphics: High</button>
    <div id="tag" hidden></div>
    <div id="banner"></div>
    <div class="ctl">
      <div id="prompt"></div>
      <div class="side">
        <button class="tb small" id="bSmoke" aria-label="Smoke bomb" hidden>Smoke</button>
        <button class="tb small" id="bDecoy" aria-label="Throw decoy bell" hidden>Decoy</button>
        <button class="tb small" id="bThrow" aria-label="Throw your cheapest item">Throw</button>
        <button class="tb small" id="bLantern" aria-label="Toggle lantern">Lamp</button>
        <button class="tb small" id="bSprint" aria-label="Sprint">Sprint</button>
        <button class="tb small" id="bBag" aria-label="Open backpack" hidden>Bag</button>
      </div>
      <button class="tb big" id="bUse" disabled>Use</button>
    </div>
  </div>
  <div id="say" hidden><span class="sn">The Fence</span><span class="st"></span></div>
  <div id="modal" hidden><div class="card" id="card"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), glc = $('gl');
let W = 0, H = 0, DPR = 1;

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pickW = ws => { let s = 0; for (const w of ws) s += w; let r = Math.random() * s; for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; } return ws.length - 1; };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hash = (i, j, k) => { const s = Math.sin(i * 12.9898 + j * 78.233 + k * 37.719) * 43758.5453; return s - Math.floor(s); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- save ----------
const SAVE_KEY = 'graveshift.save.v1';
const freshSave = () => ({ cash: 0, nights: 0, best: 0, up: { shovel: 0, bag: 0, shoes: 0, lantern: 0, scanner: 0 }, gcash: 0, gup: { flashlight: 0, boots: 0, bells: 0, flares: 0, gloves: 0 } });

function resolve(e, r, rects) {

    for (const t of TREES) if ((x - t.x) ** 2 + (y - t.y) ** 2 < 26 * 26) return false;

}

  if (timeLeft <= 60 && !warned.b) { warned.b = 1; announce('1 minute left', '1 minute left', '#e08a3c'); sfx('bell'); }
  if (timeLeft <= 20 && !warned.c) { warned.c = 1; announce('Get out!', 'Hold him off!', '#d0583f'); sfx('bell'); }

  for (const k of keepers) {
    k.flareCd = Math.max(0, (k.flareCd || 0) - dt);
    if (k.ctl === 'remote') { remoteGuardTick(k, dt); continue; }
    if (k.ctl === 'local') continue;
    if (st && st.k === k) continue; if (k.stun > 0) { k.stun -= dt; continue; } updateKeeper(k, dt); if (mode !== 'play') return;

}

function nearest() {

  const ex = EXITS.find(e => Math.hypot(P.x - e.x, P.y - e.y) < (rp('fastFence') ? 140 : 75)); if (ex) best = { type: 'gate', ex };

function newRing(first) {
